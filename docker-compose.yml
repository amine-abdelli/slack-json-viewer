services:
  slack-viewer:
    build: .
    image: slack-viewer
    ports:
      - "3000:3000"
    environment:
      # Binds each visitor's stored Slack credentials to their session cookie.
      # Without it a restart logs everyone out. Generate once:
      #   openssl rand -hex 32
      SLACK_VIEWER_SECRET: ${SLACK_VIEWER_SECRET:?set SLACK_VIEWER_SECRET}
      # How long an idle session keeps its credentials.
      SLACK_VIEWER_SESSION_TTL_HOURS: "12"
      # Concurrent headless Chromium logins; each costs a few hundred MB.
      SLACK_VIEWER_MAX_LOGINS: "2"
    volumes:
      - data:/data
    # Chromium is memory-hungry and /dev/shm defaults to 64 MB.
    shm_size: "512m"
    restart: unless-stopped

volumes:
  data:
